<!DOCTYPE html>
<html>

<head>
    <script src=
"https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js">
    </script>

    <script>
        
            $(document).ready(function () {
                $("#b1").click(function () {
                    $("#box").animate({
                        width: "350px"
                    });
                    $("#box").animate({
                        height: "250px"
                    });
                });
            });
    </script>
    <style>
        div {
            width: 100px;
            height: 100px;
            background-color: rgb(40, 18, 149);
        }

        #b1 {
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div id="box"></div>

    <button id="b1">Click Here !</button>
</body>

</html>
